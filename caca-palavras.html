<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memória</title>
    <link rel="icon" href="img/mito.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen text-white">
    <script src="script.js"></script>
    <!-- Matrix Background Effect -->
    <div class="matrix-bg">
        <canvas id="matrix-canvas"></canvas>
    </div>

    <!-- Header -->
    <header class="cyber-card shadow-2xl relative">
        <div class="container mx-auto px-4 py-6">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">                    
                    <div>
                        <h3 class="game-title text-2xl md:text-3xl font-bold text-green-400">🔍 CAÇA-PALAVRAS</h3>                    
                    </div>
                </div>
                <a href="index.html">
                <button class="btn-cyber text-white px-6 py-3 rounded-lg font-medium">
                    🏠 INÍCIO
                </button>
            </a>
            </div>
        </div>
    </header>

    <section id="game-menu" class="game-section active py-3">
        <div class="container mx-auto px-2">
            <div class="text-center mb-4">                                
            </div>

            
    <div class="grid grid-cols-1 container-grid md:grid-cols-2 lg:grid-cols-3 gap-8 max-w-7xl mx-auto"></div>
    <div class="container mx-auto px-4 max-w-4xl">
            <div class="cyber-card rounded-2xl p-8 shadow-2xl">
                <div class="text-center mb-8">                    
                    <p class="text-gray-300">Encontre as palavras relacionadas aos ODS!</p>
                </div>
                
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-2">
                        <div id="word-search-grid" class="grid grid-cols-12 gap-1 mb-6 max-w-lg mx-auto">
                            <!-- Grid será gerado pelo JavaScript -->
                        </div>
                    </div>
                    
                    <div>
                        <h3 class="text-lg font-bold mb-4 text-blue-400">Palavras para encontrar:</h3>
                        <div id="word-list" class="space-y-2">
                            <!-- Lista de palavras aparecerá aqui -->
                        </div>
                        
                        <div class="mt-6 text-center">
                            <div class="bg-green-500/20 px-4 py-2 rounded-lg border border-green-500/30">
                                <span class="text-green-300 font-medium">Encontradas: <span id="words-found">0</span>/8</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="text-center mt-8">
                    <button onclick="startWordSearch()" class="btn-cyber text-white px-8 py-3 rounded-lg font-medium">
                        🔄 Novo Jogo
                    </button>
                </div>
            </div>
        </div>
    </section>        
    
     <!-- Footer -->
    <footer class="cyber-card py-8 mt-12">
        <div class="container mx-auto px-4 text-center">
            <div class="mb-4">
                <h3 class="game-title text-xl font-bold mb-2 text-green-400">Universidade Federal Rural do Rio de Janeiro (UFRRJ)</h3>
                <p class="text-gray-300">Laboratório de Ação Humanitária e Paradiplomacia</p>
            </div>
            <div class="text-sm text-gray-400">
                <p>&copy; 2025 UFRRJ - Laboratório de Direitos Humanos. Projeto de extensão.</p>
            </div>
        </div>
    </footer>
</body>
</html>
