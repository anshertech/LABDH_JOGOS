<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memória</title>
    <link rel="icon" href="img/mito.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen text-white">
    <script src="script.js"></script>
    <!-- Matrix Background Effect -->
    <div class="matrix-bg">
        <canvas id="matrix-canvas"></canvas>
    </div>

    <!-- Header -->
    <header class="cyber-card shadow-2xl relative">
        <div class="container mx-auto px-4 py-6">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">                    
                    <div>
                        <h3 class="game-title text-2xl md:text-3xl font-bold text-green-400">📊 CALCULADORA DE IMPACTO</h3>                    
                    </div>
                </div>
                <a href="index.html">
                <button class="btn-cyber text-white px-6 py-3 rounded-lg font-medium">
                    🏠 INÍCIO
                </button>
            </a>
            </div>
        </div>
    </header>

    <section id="game-menu" class="game-section active py-3">
        <div class="container mx-auto px-2">
            <div class="text-center mb-4">                                
            </div>

            
    <div class="grid grid-cols-1 container-grid md:grid-cols-2 lg:grid-cols-3 gap-8 max-w-7xl mx-auto"></div>
    <div class="container mx-auto px-4 max-w-4xl">
            <div class="cyber-card rounded-2xl p-8 shadow-2xl">
                <div class="text-center mb-8">                    
                    <p class="text-gray-300">Calcule seu impacto anual!</p>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="space-y-6">
                        <div>
                            <label class="block text-sm font-semibold mb-2 text-green-400">Quantos banhos você toma por dia?</label>
                            <input type="number" id="baths" class="w-full p-3 bg-gray-800 border-2 border-green-500/30 rounded-lg focus:border-green-500 focus:outline-none text-white" placeholder="Ex: 2" min="1" max="10">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-semibold mb-2 text-green-400">Em média, quantos minutos você gasta em cada banho?</label>
                            <input type="number" id="minutes" class="w-full p-3 bg-gray-800 border-2 border-green-500/30 rounded-lg focus:border-green-500 focus:outline-none text-white" placeholder="Ex: 10" min="1" max="60">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-semibold mb-2 text-green-400">Quantos quilômetros você percorre por dia para ir ao trabalho, escola ou faculdade?</label>
                            <input type="number" id="distance" class="w-full p-3 bg-gray-800 border-2 border-green-500/30 rounded-lg focus:border-green-500 focus:outline-none text-white" placeholder="Ex: 10" min="0">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-semibold mb-2 text-green-400">Qual é o meio de transporte utilizado?</label>
                            <select id="transport" class="w-full p-3 bg-gray-800 border-2 border-green-500/30 rounded-lg focus:border-green-500 focus:outline-none text-white">
                                <option value="">Selecione</option>
                                <option value="carro">🚗 Carro</option>
                                <option value="onibus">🚌 Ônibus</option>
                                <option value="moto">🏍️ Moto</option>
                                <option value="bicicleta">🚲 Bicicleta</option>
                                <option value="pe">🚶 A pé</option>
                                <option value="metro">🚇 Metrô</option>
                            </select>
                        </div>
                        
                        <button onclick="calculateImpact()" class="w-full btn-cyber text-white py-3 rounded-lg font-medium">
                            🌱 Calcular Impacto
                        </button>
                    </div>
                    
                    <div id="impact-result" class="cyber-card rounded-xl p-6 hidden">
                        <h3 class="text-lg font-bold mb-4 text-blue-400">Seus Resultados:</h3>
                        <div id="carbon-footprint" class="text-center mb-4">
                            <!-- Resultado aparecerá aqui -->
                        </div>
                        <div id="impact-tips" class="space-y-2">
                            <!-- Dicas aparecerão aqui -->
                        </div>
                    </div>
                </div>
            </div>        
    </section>
            
    
     <!-- Footer -->
    <footer class="cyber-card py-8 mt-12">
        <div class="container mx-auto px-4 text-center">
            <div class="mb-4">
                <h3 class="game-title text-xl font-bold mb-2 text-green-400">Universidade Federal Rural do Rio de Janeiro (UFRRJ)</h3>
                <p class="text-gray-300">Laboratório de Ação Humanitária e Paradiplomacia</p>
            </div>
            <div class="text-sm text-gray-400">
                <p>&copy; 2025 UFRRJ - Laboratório de Direitos Humanos. Projeto de extensão.</p>
            </div>
        </div>
    </footer>
</body>
</html>
